services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      - TELEGRAM_API_ID=39825758
      - TELEGRAM_API_HASH=bb7a910b15bb2c9d49da9efc586a668d
      - TELEGRAM_LOCAL=1
    ports:
      - "8081:8081"
    volumes:
      - ./telegram-bot-api-data:/var/lib/telegram-bot-api
    networks:
      - freeeman-network
    restart: unless-stopped

  freeman-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freeman_backend
    env_file:
      - ./backend/.env
    environment:
      AWS_S3_ENDPOINT_URL: http://freeman-minio:9000
    ports:
      - "8000:8000"
    depends_on:
      freeman-minio:
        condition: service_started
    networks:
      - freeeman-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=20)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  freeman-bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: freeman_bot
    env_file:
      - ./bot/.env
    environment:
      API_URL: http://freeman-backend:8000
    depends_on:
      freeman-backend:
        condition: service_healthy
      telegram-bot-api:
        condition: service_started
    volumes:
      - ./telegram-bot-api-data:/var/lib/telegram-bot-api:ro
    networks:
      - freeeman-network
    restart: unless-stopped

  freeman-admin-bot:
    build:
      context: ./admin-bot
      dockerfile: Dockerfile
    container_name: freeeman_admin_bot
    env_file:
      - ./admin-bot/.env
    environment:
      API_URL: http://freeman-backend:8000
    depends_on:
      freeman-backend:
        condition: service_healthy
      telegram-bot-api:
        condition: service_started
    volumes:
      - ./telegram-bot-api-data:/var/lib/telegram-bot-api:ro
    networks:
      - freeeman-network
    restart: unless-stopped

  freeman-minio:
    image: quay.io/minio/minio
    container_name: freeman-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-supersecretpassword}
      MINIO_ADDRESS: ":9000"
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - ./minio-data:/data
    command: server /data
    networks:
      - freeeman-network
    restart: unless-stopped

  freeman-minio-init:
    image: minio/mc
    container_name: freeman-minio-init
    depends_on:
      - freeman-minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://freeman-minio:9000 "${MINIO_ROOT_USER:-admin}" "${MINIO_ROOT_PASSWORD:-supersecretpassword}" >/dev/null 2>&1; do
          sleep 1
        done
        mc mb --ignore-existing local/freeman-bucket
    networks:
      - freeeman-network
    restart: "no"

  # --- Monitoring ---

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki.yml
    networks:
      - freeeman-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki
    networks:
      - freeeman-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    networks:
      - freeeman-network
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - freeeman-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ALERTING_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - freeeman-network
    restart: unless-stopped

networks:
  freeeman-network:
    driver: bridge

volumes:
  loki-data:
  prometheus-data:
  grafana-data:
