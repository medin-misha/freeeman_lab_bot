apiVersion: 1

groups:
  - orgId: 1
    name: backend_alerts
    folder: Alerts
    interval: 1m
    rules:

      # Alert on any 5xx errors from the backend
      - uid: backend-5xx-errors
        title: "Backend 5xx Errors"
        condition: threshold
        data:
          - refId: rate
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: "sum(rate(http_requests_total{status_code=~\"5..\"}[5m]))"
              instant: true
              refId: rate
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: rate
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [rate]
                  reducer:
                    type: last
              refId: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Backend returning 5xx errors"
          description: "{{ $values.rate.Value | printf \"%.4f\" }} req/s with status 5xx in the last 5 minutes."
          fired_at: "{{ .StartsAt.Format \"2006-01-02 15:04:05\" }}"
        labels:
          severity: critical

      # Alert when a container is down (not seen for > 60s)
      - uid: container-down
        title: "Container Down"
        condition: threshold
        data:
          - refId: last_seen
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: "max by (container_label_com_docker_compose_service) (time() - container_last_seen{container_label_com_docker_compose_service=~\"freeman-backend|freeman-bot|freeman-admin-bot|freeman-minio\",name!=\"\"})"
              instant: true
              refId: last_seen
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: last_seen
              conditions:
                - evaluator:
                    type: gt
                    params: [60]
                  operator:
                    type: and
                  query:
                    params: [last_seen]
                  reducer:
                    type: last
              refId: threshold
        noDataState: Alerting
        execErrState: Error
        for: 1m
        annotations:
          summary: "Container is down"
          description: "Container {{ $labels.container_label_com_docker_compose_service }} has not been seen for over 60 seconds."
          fired_at: "{{ .StartsAt.Format \"2006-01-02 15:04:05\" }}"
        labels:
          severity: critical
